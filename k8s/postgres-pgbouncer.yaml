apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: medflow-db-pooler
  labels:
    app: medflow-db-pooler
    app.kubernetes.io/part-of: medflow
spec:
  cluster:
    name: medflow-db-ha
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"
      min_pool_size: "5"
      reserve_pool_size: "5"
      max_db_connections: "100"
      server_idle_timeout: "600"
      server_reset_query: "DISCARD ALL"
      query_timeout: "45"
      client_idle_timeout: "300"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
