apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medflow-backend-hpa
  labels:
    app.kubernetes.io/part-of: medflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medflow-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  labels:
    app.kubernetes.io/part-of: medflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
