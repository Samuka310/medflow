services:
  db:
    image: postgres:16
    container_name: medflow-db
    environment:
      POSTGRES_USER: medflow
      POSTGRES_PASSWORD: medflow
      POSTGRES_DB: medflow
    ports:
      - "5432:5432"
    volumes:
      - medflow-postgres-data:/var/lib/postgresql/data
    networks:
      - medflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medflow -d medflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: medflow-rabbitmq
    hostname: medflow-rabbit
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_ERLANG_COOKIE=medflow-secret-cookie
    tmpfs:
      - /var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - medflow-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: medflow-backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/medflow
      - SPRING_DATASOURCE_USERNAME=medflow
      - SPRING_DATASOURCE_PASSWORD=medflow
      - SPRING_FLYWAY_URL=jdbc:postgresql://db:5432/medflow
      - SPRING_FLYWAY_USER=medflow
      - SPRING_FLYWAY_PASSWORD=medflow
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_RABBITMQ_HOST=rabbitmq
      - NOTIFICATION_SERVICE_URL=http://notification-service:8082
      - JWT_SECRET=${JWT_SECRET:-dev_insecure_dummy_key_for_local_testing_min_32_bytes_long!!}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - medflow-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: medflow-notification-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - medflow-network

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: medflow-api-gateway
    ports:
      - "8080:8080"
    environment:
      - MEDFLOW_CORE_URL=http://backend:8081
      - NOTIFICATION_SERVICE_URL=http://notification-service:8082
      - JWT_SECRET=${JWT_SECRET:-dev_insecure_dummy_key_for_local_testing_min_32_bytes_long!!}
    depends_on:
      backend:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - medflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medflow-frontend
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - medflow-network

  prometheus:
    image: prom/prometheus:latest
    container_name: medflow-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - medflow-network

  grafana:
    image: grafana/grafana:latest
    container_name: medflow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - medflow-network

volumes:
  medflow-postgres-data:

networks:
  medflow-network:
    driver: bridge
