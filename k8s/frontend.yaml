apiVersion: v1
kind: Service
metadata:
  name: medflow-frontend-service
  labels:
    app: medflow-frontend
    app.kubernetes.io/part-of: medflow
spec:
  selector:
    app: medflow-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medflow-frontend
  labels:
    app: medflow-frontend
    app.kubernetes.io/part-of: medflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medflow-frontend
  template:
    metadata:
      labels:
        app: medflow-frontend
    spec:
      containers:
      - name: medflow-frontend
        image: medflow-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
