apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: medflow-vault-store
  namespace: default
  labels:
    app.kubernetes.io/part-of: medflow
spec:
  provider:
    vault:
      server: "https://vault.internal.medflow.com:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "medflow-backend-role"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: medflow-external-secrets
  namespace: default
  labels:
    app.kubernetes.io/part-of: medflow
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: medflow-vault-store
    kind: SecretStore
  target:
    name: medflow-secrets
    creationPolicy: Owner
  data:
    - secretKey: postgres-user
      remoteRef:
        key: production/medflow
        property: postgres-user
    - secretKey: postgres-password
      remoteRef:
        key: production/medflow
        property: postgres-password
    - secretKey: postgres-db
      remoteRef:
        key: production/medflow
        property: postgres-db
    - secretKey: rabbitmq-user
      remoteRef:
        key: production/medflow
        property: rabbitmq-user
    - secretKey: rabbitmq-password
      remoteRef:
        key: production/medflow
        property: rabbitmq-password
    - secretKey: jwt-secret
      remoteRef:
        key: production/medflow
        property: jwt-secret
    - secretKey: s3-access-key
      remoteRef:
        key: production/medflow
        property: s3-access-key
    - secretKey: s3-secret-key
      remoteRef:
        key: production/medflow
        property: s3-secret-key

