apiVersion: v1
kind: Service
metadata:
  name: medflow-rabbitmq-service
spec:
  selector:
    app: medflow-rabbitmq
  ports:
    - protocol: TCP
      port: 5672
      targetPort: 5672
    - name: management
      protocol: TCP
      port: 15672
      targetPort: 15672
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medflow-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medflow-rabbitmq
  template:
    metadata:
      labels:
        app: medflow-rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672
        - containerPort: 15672
