apiVersion: v1
kind: Service
metadata:
  name: medflow-rabbitmq-service
  labels:
    app: medflow-rabbitmq
    app.kubernetes.io/part-of: medflow
spec:
  selector:
    app: medflow-rabbitmq
  ports:
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672
    - name: management
      protocol: TCP
      port: 15672
      targetPort: 15672
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medflow-rabbitmq
  labels:
    app: medflow-rabbitmq
    app.kubernetes.io/part-of: medflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medflow-rabbitmq
  template:
    metadata:
      labels:
        app: medflow-rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: medflow-secrets
              key: rabbitmq-user
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: medflow-secrets
              key: rabbitmq-password
        readinessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 5672
          initialDelaySeconds: 30
          periodSeconds: 15
